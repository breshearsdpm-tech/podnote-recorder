<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="PodNote">
  <meta name="theme-color" content="#0f5c63">
  <title>PodNote Recorder</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="brand"><img src="icon.svg" alt="" width="32" height="32"> PodNote</div>
    <div id="driveStatus" class="pill">Drive: not connected</div>
  </header>

  <main>
    <section class="card" id="schedCard">
      <div class="row between">
        <h2>Checked in today</h2>
        <button id="btnSched" class="small-btn">Refresh</button>
      </div>
      <div id="schedList" class="chips"></div>
      <p id="schedNote" class="muted small"></p>
    </section>

    <section class="card recorder">
      <div id="recPatient" class="recpatient">Tap a patient above</div>
      <div id="timer" class="timer">00:00</div>
      <canvas id="meter" width="600" height="60" aria-hidden="true"></canvas>
      <div id="recState" class="muted">Ready</div>
      <div class="controls">
        <button id="btnRecord" class="big rec">● Record</button>
        <button id="btnPause" class="big" disabled>Pause</button>
        <button id="btnStop" class="big stop" disabled>■ Stop &amp; Save</button>
      </div>
      <div class="controls">
        <button id="btnHold" class="big hold" disabled>⏸ Hold – see another patient</button>
      </div>
      <p class="muted small">Hold saves this visit on the iPad so you can record another patient; tap Resume on it later. Keep PodNote on screen while recording.</p>
    </section>

    <section class="card" id="visitCard">
      <h2>Visit</h2>
      <label>Patient name or MRN
        <input id="patient" type="text" autocomplete="off" autocapitalize="words" placeholder="e.g. Smith, John  or  MRN 104233">
      </label>
      <div class="row">
        <label>Visit type
          <select id="visitType"></select>
        </label>
        <label>Date of service
          <input id="dos" type="date">
        </label>
      </div>
      <label>Quick notes for the AI (optional)
        <textarea id="quickNotes" rows="2" placeholder="e.g. Right foot only. Debrided 3 nails. Vitals in chart."></textarea>
      </label>
      <label class="check"><input id="consent" type="checkbox" checked> Patient consented to ambient recording</label>
    </section>

    <section class="card">
      <div class="row between">
        <h2>Recordings on this iPad</h2>
        <div>
          <button id="btnUploadAll" class="small-btn primary">Upload all</button>
          <button id="btnClearDone" class="small-btn">Clear uploaded</button>
        </div>
      </div>
      <ul id="queue" class="queue"></ul>
      <p id="emptyQueue" class="muted">No recordings yet.</p>
    </section>
  </main>

  <div id="toast" class="toast" hidden></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
